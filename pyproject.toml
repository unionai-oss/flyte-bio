[project]
name = "flyte-bio"
version = "0.1.0"
description = "The Flyte 2 open-source library for biology: ~900 containerized scientific tools and end-to-end workflows, ready for scientists and AI agents"
readme = "README.md"
authors = [{ name = "Kyle Hazen", email = "kyle@union.ai" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["flyte", "biology", "bioinformatics", "genomics", "single-cell", "workflows", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "flyte>=2.13.1",
]

[project.urls]
Homepage = "https://github.com/unionai-oss/flyte-bio"
Documentation = "https://github.com/unionai-oss/flyte-bio/tree/main/docs"
Repository = "https://github.com/unionai-oss/flyte-bio"
Issues = "https://github.com/unionai-oss/flyte-bio/issues"

[project.optional-dependencies]
# flyte_bio.config: OmegaConf configs as task inputs. Hydra (`flyte hydra
# run`) is only needed where runs are launched, not in the task image.
config = ["flyteplugins-omegaconf>=2.13.1"]
hydra = ["flyteplugins-hydra>=2.13.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyte_bio"]

[tool.hatch.build.targets.sdist]
include = ["src/flyte_bio", "README.md", "LICENSE"]

[dependency-groups]
# Test-only: the fixture loader fetches via flyte.storage.get, whose fsspec
# https backend needs aiohttp + requests. uv installs the default `dev`
# group into the test image, so these land in the pod. Once fixtures move
# to S3 (obstore-native), neither is needed and both can be dropped.
# anndata (with scipy) lets the scRNA-seq tests check h5ad contents.
# The config plugins let the config tests load Hydra configs.
dev = [
    "aiohttp",
    "anndata>=0.13.4",
    "flyteplugins-hydra>=2.13.1",
    "flyteplugins-omegaconf>=2.13.1",
    "requests",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = 20
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "PLW", "YTT", "ASYNC", "C4", "T10", "EXE", "ISC",
    "LOG", "PIE", "Q", "RSE", "FLY", "PGH", "PLC", "PLE", "FURB", "RUF",
]
ignore = ["PGH003", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Vendored helper scripts (flyte_bio.scripts) preserve upstream logic
# verbatim — don't restyle them. The package __init__ is ours and stays
# strict (it trips none of these rules).
"src/flyte_bio/scripts/*.py" = ["PLW2901", "E501", "EXE001", "RUF005", "LOG002", "FLY002", "FURB129"]
# bbmap.py embeds upstream's BBSplit index-reuse bash verbatim (long sed/jshell lines).
"src/flyte_bio/modules/bbmap.py" = ["E501"]
# deseq2_qc.py embeds upstream's header-relabelling sed lines verbatim.
"src/flyte_bio/modules/deseq2_qc.py" = ["E501"]
